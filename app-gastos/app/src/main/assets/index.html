<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meu Bolso</title>
<style>
  :root{
    --bg:#0F172A; --card:#1E293B; --card2:#273449; --line:#334155;
    --txt:#F1F5F9; --mut:#94A3B8;
    --red:#F43F5E; --green:#10B981; --violet:#8B5CF6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;min-height:100%}
  body{padding:18px 16px 110px;overflow-x:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .hello{font-size:13px;color:var(--mut)}
  h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
  .month{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px}
  .month button{width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--mut)}
  .month button:active{background:var(--card2)}
  .month span{font-size:13px;font-weight:600;min-width:74px;text-align:center;text-transform:capitalize}

  .hero{border-radius:24px;padding:20px;background:linear-gradient(135deg,#7C3AED 0%,#4F46E5 50%,#0EA5E9 100%);
        position:relative;overflow:hidden;box-shadow:0 12px 30px -10px rgba(124,58,237,.6)}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero::before{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero small{font-size:13px;opacity:.85}
  .hero .big{font-size:34px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
  .hero .sub{font-size:12px;opacity:.85}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 22px}
  .stat{background:var(--card);border-radius:18px;padding:14px}
  .stat .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;margin-bottom:10px}
  .stat small{font-size:12px;color:var(--mut)}
  .stat b{display:block;font-size:18px;margin-top:2px}
  .stat em{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:4px}
  .in .ic{background:rgba(16,185,129,.15)} .in b{color:var(--green)}
  .hero{transition:background .4s}
  .hero.pos{background:linear-gradient(135deg,#059669 0%,#10B981 55%,#0EA5E9 100%);box-shadow:0 12px 30px -10px rgba(16,185,129,.55)}
  .hero.neg{background:linear-gradient(135deg,#BE123C 0%,#F43F5E 55%,#F97316 100%);box-shadow:0 12px 30px -10px rgba(244,63,94,.55)}
  .del.sure{background:var(--red);color:#fff}
  .out .ic{background:rgba(244,63,94,.15);color:var(--red)} .out b{color:var(--red)}
  .tot .ic{background:rgba(139,92,246,.15)}

  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{padding:8px 14px;border-radius:999px;background:var(--card);font-size:13px;color:var(--mut);font-weight:600}
  .tabs button.on{background:var(--txt);color:var(--bg)}

  .day{font-size:12px;color:var(--mut);margin:16px 4px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px;border-radius:16px;margin-bottom:8px;width:100%;text-align:left;animation:pop .25s ease}
  .item:active{background:var(--card2)}
  .item .emo{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
  .item .nm{flex:1;min-width:0}
  .item .nm b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .nm small{font-size:12px;color:var(--mut)}
  .item .val{font-weight:700;font-size:15px;white-space:nowrap}
  .val.g{color:var(--red)} .val.s{color:var(--green)}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}
  .empty div{font-size:44px;margin-bottom:8px}

  .fab{position:fixed;right:20px;bottom:24px;width:62px;height:62px;border-radius:20px;font-size:32px;font-weight:300;color:#fff;
       background:linear-gradient(135deg,#8B5CF6,#10B981);box-shadow:0 10px 25px -6px rgba(139,92,246,.7);z-index:5}
  .fab:active{transform:scale(.94)}

  .shade{position:fixed;inset:0;background:rgba(2,6,23,.6);opacity:0;pointer-events:none;transition:.2s;z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px 22px;
         transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:11;max-height:92vh;overflow:auto}
  .open .shade{opacity:1;pointer-events:auto} .open .sheet{transform:none}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}

  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px}
  .seg button{padding:11px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut)}
  .seg button.on.g{background:var(--red);color:#fff} .seg button.on.s{background:var(--green);color:#fff}

  .money{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:4px 0 16px}
  .money span{font-size:22px;color:var(--mut);font-weight:700}
  .money input{background:none;border:0;outline:0;color:var(--txt);font-size:42px;font-weight:800;width:6ch;min-width:0;text-align:left;font-family:inherit}
  label{display:block;font-size:12px;color:var(--mut);margin:0 2px 6px;font-weight:600}
  .field{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:14px;color:var(--txt);font-size:16px;outline:0;font-family:inherit;margin-bottom:12px}
  .field:focus{border-color:var(--violet)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;white-space:nowrap}
  .chip.on{border-color:var(--violet);background:rgba(139,92,246,.18)}
  .save{width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#8B5CF6,#6366F1);margin-top:6px}
  .save:active{opacity:.85}
  .del{width:100%;padding:13px;border-radius:14px;color:var(--red);font-weight:700;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);
         padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div><div class="hello" id="hello">Olá 👋</div><h1>Meu Bolso</h1></div>
  <div class="month"><button id="prev">‹</button><span id="mes"></span><button id="next">›</button></div>
</header>

<section class="hero" id="hero">
  <small id="saldoTit">⚖️ Meu saldo</small>
  <div class="big" id="saldo">R$ 0,00</div>
  <div class="sub" id="saldoSub">Ganhei/guardei − gastei</div>
</section>

<div class="grid">
  <div class="stat in"><div class="ic">🐷</div><small>Guardei no total</small><b id="guardado">R$ 0,00</b><em id="guardadoMes">+ R$ 0,00 no mês</em></div>
  <div class="stat out"><div class="ic">🛒</div><small>Gastei no total</small><b id="gastoTotal">R$ 0,00</b><em id="gastoMes">− R$ 0,00 no mês</em></div>
</div>

<div class="tabs">
  <button data-f="all" class="on">Tudo</button>
  <button data-f="g">Gastos</button>
  <button data-f="s">Guardado</button>
</div>

<div id="lista"></div>

<button class="fab" id="add" aria-label="Adicionar">+</button>

<div id="modal">
  <div class="shade" id="shade"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="seg">
      <button data-t="g" class="g on">🛒 Gastei</button>
      <button data-t="s" class="s">🐷 Guardei</button>
    </div>
    <div class="money"><span>R$</span><input id="valor" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    <label for="nome" id="lblNome">Nome do produto</label>
    <input class="field" id="nome" placeholder="Ex: Pão, Gasolina, Tênis..." autocomplete="off" maxlength="60">
    <div class="chips" id="recentes"></div>
    <label>Categoria</label>
    <div class="chips" id="cats"></div>
    <label for="data">Data</label>
    <input class="field" id="data" type="date">
    <button class="save" id="salvar">Salvar</button>
    <button class="del" id="excluir" hidden>Excluir</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='meubolso.v1';
const CATS={
  g:[['🍔','Comida'],['🛒','Mercado'],['🚗','Transporte'],['🏠','Casa'],['👕','Roupas'],['🎮','Lazer'],['💊','Saúde'],['📱','Contas'],['🎁','Presente'],['📦','Outros']],
  s:[['🐷','Poupança'],['💼','Salário'],['🎯','Meta'],['📈','Investimento'],['💵','Extra'],['📦','Outros']]
};
const $=id=>document.getElementById(id);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};

let dados=[]; try{dados=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const salvarDados=()=>{try{localStorage.setItem(KEY,JSON.stringify(dados))}catch(e){}};

let ref=new Date(); ref.setDate(1);
let filtro='all', tipo='g', cat='🍔', editId=null;

function render(){
  const ym=ref.getFullYear()+'-'+String(ref.getMonth()+1).padStart(2,'0');
  $('mes').textContent=ref.toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).replace('.','').replace(' de ',' ');
  const doMes=dados.filter(d=>d.data.startsWith(ym));
  const soma=(arr,t)=>arr.filter(d=>d.tipo===t).reduce((a,b)=>a+b.valor,0);
  const totS=soma(dados,'s'), totG=soma(dados,'g'), saldo=totS-totG;
  $('guardado').textContent=brl(totS);
  $('gastoTotal').textContent=brl(totG);
  $('guardadoMes').textContent='+ '+brl(soma(doMes,'s'))+' no mês';
  $('gastoMes').textContent='− '+brl(soma(doMes,'g'))+' no mês';
  $('saldo').textContent=(saldo<0?'− ':'')+brl(Math.abs(saldo));
  $('hero').className='hero '+(saldo<0?'neg':saldo>0?'pos':'');
  $('saldoTit').textContent=saldo<0?'📉 Você está negativo':saldo>0?'📈 Você está positivo':'⚖️ Meu saldo';
  $('saldoSub').textContent=saldo<0?'Gastou '+brl(-saldo)+' a mais do que guardou':saldo>0?'Sobrou '+brl(saldo)+' do que você ganhou/guardou':'Ganhei/guardei − gastei';

  const lista=doMes.filter(d=>filtro==='all'||d.tipo===filtro).sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id);
  if(!lista.length){
    $('lista').innerHTML='<div class="empty"><div>🪙</div>Nada por aqui ainda.<br>Toque no <b>+</b> para adicionar.</div>';return;
  }
  let html='',dia='';
  for(const d of lista){
    if(d.data!==dia){dia=d.data;html+='<div class="day">'+rotuloDia(dia)+'</div>'}
    html+=`<button class="item" data-id="${d.id}"><div class="emo">${d.cat}</div>
      <div class="nm"><b>${esc(d.nome)}</b><small>${d.tipo==='g'?'Gasto':'Guardado'}</small></div>
      <div class="val ${d.tipo}">${d.tipo==='g'?'− ':'+ '}${brl(d.valor)}</div></button>`;
  }
  $('lista').innerHTML=html;
}
function rotuloDia(s){
  const h=hoje(); const o=new Date(Date.now()-864e5); o.setMinutes(o.getMinutes()-o.getTimezoneOffset());
  if(s===h)return'Hoje'; if(s===o.toISOString().slice(0,10))return'Ontem';
  const [y,m,d]=s.split('-'); return new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'});
}
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setTipo(t){
  tipo=t;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('lblNome').textContent=t==='g'?'Nome do produto':'De onde veio / descrição';
  $('nome').placeholder=t==='g'?'Ex: Pão, Gasolina, Tênis...':'Ex: Salário, Poupança...';
  if(!CATS[t].some(c=>c[0]===cat))cat=CATS[t][0][0];
  $('cats').innerHTML=CATS[t].map(c=>`<button class="chip ${c[0]===cat?'on':''}" data-c="${c[0]}">${c[0]} ${c[1]}</button>`).join('');
  const rec=[...new Map(dados.filter(d=>d.tipo===t).sort((a,b)=>b.id-a.id).map(d=>[d.nome.toLowerCase(),d])).values()].slice(0,8);
  $('recentes').innerHTML=rec.map(d=>`<button class="chip" data-n="${esc(d.nome)}" data-c="${d.cat}">${d.cat} ${esc(d.nome)}</button>`).join('');
  $('recentes').style.display=rec.length?'flex':'none';
}
function abrir(item){
  editId=item?item.id:null;
  cat=item?item.cat:(tipo==='g'?'🍔':'🐷');
  setTipo(item?item.tipo:tipo);
  $('valor').value=item?item.valor.toFixed(2).replace('.',','):'';
  $('nome').value=item?item.nome:'';
  $('data').value=item?item.data:hoje(); fit();
  $('salvar').textContent=item?'Salvar alterações':'Salvar';
  $('excluir').hidden=!item; $('excluir').classList.remove('sure'); $('excluir').textContent='🗑️ Excluir';
  $('modal').classList.add('open');
  if(!item)setTimeout(()=>$('valor').focus(),300);
}
function fit(){const v=$('valor');v.style.width=Math.max(4,(v.value||'0,00').length+1)+'ch'}
function fechar(){ $('modal').classList.remove('open'); document.activeElement.blur(); }
window.voltar=()=>{ if($('modal').classList.contains('open')){fechar();return true} return false };

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

$('add').onclick=()=>abrir();
$('shade').onclick=fechar;
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(b)setTipo(b.dataset.t)};
$('cats').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;
  $('cats').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))};
$('recentes').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$('nome').value=b.dataset.n;cat=b.dataset.c;setTipo(tipo);$('valor').focus()};
$('valor').oninput=e=>{fit();e.target.value=e.target.value.replace(/[^\d,.]/g,'').replace('.',',').replace(/,(?=.*,)/g,'')};
$('salvar').onclick=()=>{
  const valor=parseFloat(($('valor').value||'').replace(',','.'));
  const nome=$('nome').value.trim();
  if(!(valor>0)){toast('Digite um valor');$('valor').focus();return}
  if(!nome){toast(tipo==='g'?'Digite o nome do produto':'Digite uma descrição');$('nome').focus();return}
  const reg={id:editId||Date.now(),tipo,nome,valor:Math.round(valor*100)/100,cat,data:$('data').value||hoje()};
  if(editId)dados=dados.map(d=>d.id===editId?reg:d); else dados.push(reg);
  salvarDados();
  const [y,m]=reg.data.split('-');ref=new Date(y,m-1,1);
  fechar();render();toast(editId?'Atualizado ✓':(tipo==='g'?'Gasto anotado ✓':'Guardado! 🐷'));
};
$('excluir').onclick=()=>{ const x=$('excluir'); if(!x.classList.contains('sure')){x.classList.add('sure');x.textContent='Toque de novo para excluir';return}
  dados=dados.filter(d=>d.id!==editId);salvarDados();fechar();render();toast('Excluído') };
$('lista').onclick=e=>{const b=e.target.closest('.item');if(b)abrir(dados.find(d=>d.id==b.dataset.id))};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;filtro=b.dataset.f;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()};
$('prev').onclick=()=>{ref.setMonth(ref.getMonth()-1);render()};
$('next').onclick=()=>{ref.setMonth(ref.getMonth()+1);render()};
const h=new Date().getHours(); $('hello').textContent=(h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')+' 👋';
render();
</script>
</body>
</html>
